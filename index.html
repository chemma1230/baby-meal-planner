<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eaf3f6" />
  <title>宝宝每周食谱规划器</title>
  <style>
    :root {
      --bg: #f4f8fa;
      --panel: #ffffff;
      --text: #263944;
      --muted: #667b86;
      --line: #d7e4e9;
      --accent: #5f8fa3;
      --accent-strong: #477789;
      --accent-soft: #e3f0f4;
      --accent-pale: #f0f7f9;
      --good: #4f7f73;
      --danger: #a45563;
      --shadow: 0 12px 34px rgba(57, 91, 105, 0.09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1560px, 100%);
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    header {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(28px, 5vw, 44px); }
    h2 { margin-bottom: 14px; }
    .subtitle { margin: 0; color: var(--muted); }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 14px;
      background: var(--panel);
      color: var(--text);
      transition: transform .15s ease, border-color .15s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn.soft { background: var(--accent-soft); border-color: transparent; }
    .btn.danger { color: var(--danger); }
    .btn.small { padding: 6px 10px; border-radius: 10px; font-size: 13px; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab {
      white-space: nowrap;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: transparent;
      color: var(--muted);
    }

    .tab.active { background: var(--accent-soft); color: var(--text); }

    .view { display: none; }
    .view.active { display: block; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label { display: grid; gap: 7px; font-size: 14px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 92px; resize: vertical; }
    .span-2 { grid-column: 1 / -1; }

    .meal-type-fieldset {
      border: 0;
      padding: 0;
      margin: 0;
      min-width: 0;
    }
    .meal-type-fieldset legend {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .meal-type-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .meal-type-option {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      background: white;
      color: var(--text);
      cursor: pointer;
    }
    .meal-type-option:has(input:checked) {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .meal-type-option input {
      width: auto;
      margin: 0;
      accent-color: var(--accent);
    }
    .helper-text {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0 0;
    }

    .recipe-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .recipe-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      background: var(--accent-pale);
    }

    .recipe-card h3 { margin-bottom: 8px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--accent-soft);
    }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      overflow: visible;
      padding-bottom: 8px;
    }

    .day {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      background: var(--accent-pale);
      min-height: 470px;
      min-width: 0;
    }

    .day h3 { margin-bottom: 10px; }
    .meal {
      border-top: 1px dashed var(--line);
      padding: 11px 0;
    }
    .meal:first-of-type { border-top: 0; }
    .meal-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .meal-name { min-height: 42px; font-weight: 600; }
    .meal-actions { display: flex; gap: 6px; margin-top: 8px; }
    .locked { color: var(--good); }

    .settings-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 16px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 28px 10px;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    .shopping {
      columns: 2;
      column-gap: 28px;
      padding-left: 20px;
    }

    .notice {
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .footer-note { color: var(--muted); font-size: 13px; margin-top: 18px; }

    @media (max-width: 1180px) {
      .week-grid {
        grid-template-columns: repeat(7, minmax(150px, 1fr));
        overflow-x: auto;
      }
    }

    @media print {
      @page { size: landscape; margin: 0.35in; }
      body { background: white; color: #111; }
      .app { width: 100%; max-width: none; padding: 0; }
      header, .tabs, .notice, .settings-grid, .planner-actions,
      #recipes, #shopping, .footer-note, .meal-actions { display: none !important; }
      #planner, #planner.view { display: block !important; }
      .panel { border: 0; box-shadow: none; padding: 0; }
      .week-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
        overflow: visible;
        padding: 0;
      }
      .day {
        min-height: 0;
        padding: 7px;
        border-radius: 7px;
        background: white;
        break-inside: avoid;
      }
      .day h3 { font-size: 13px; margin-bottom: 5px; text-align: center; }
      .meal { padding: 6px 0; }
      .meal-label { font-size: 9px; }
      .meal-name { min-height: 24px; font-size: 10px; line-height: 1.25; }
      .meta { font-size: 8px; margin-bottom: 0; }
    }

    @media (max-width: 900px) {
      .recipe-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .form-grid, .settings-grid, .recipe-list { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .shopping { columns: 1; }
      .app { padding-top: 16px; }
      header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1 data-i18n="title">宝宝每周食谱规划器 🥣</h1>
        <p class="subtitle" data-i18n="subtitle">轻松安排一周饮食，把每天的选择题变简单。</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="languageBtn" type="button">English</button>
        <button class="btn" id="printBtn" type="button" data-i18n="print">打印周菜单</button>
        <button class="btn" id="exportBtn" data-i18n="export">导出数据</button>
        <label class="btn" for="importInput" data-i18n="import">导入数据</label>
        <input id="importInput" type="file" accept="application/json" hidden />
      </div>
    </header>

    <nav class="tabs" aria-label="功能导航" data-i18n-aria="navLabel">
      <button class="tab active" data-view="planner" data-i18n="tabPlanner">本周菜单</button>
      <button class="tab" data-view="recipes" data-i18n="tabRecipes">食谱库</button>
      <button class="tab" data-view="shopping" data-i18n="tabShopping">购物清单</button>
    </nav>

    <section class="view active" id="planner">
      <div class="notice">
        <span data-i18n="localNotice">数据保存在当前浏览器中。每位使用者都会拥有自己的独立食谱库和菜单。</span>
      </div>

      <div class="panel">
        <div class="grid settings-grid">
          <label>
            <span data-i18n="weekdayMax">工作日最长烹饪时间</span>
            <select id="weekdayMax">
              <option value="15" data-i18n="min15">15 分钟</option>
              <option value="30" selected data-i18n="min30">30 分钟</option>
              <option value="45" data-i18n="min45">45 分钟</option>
              <option value="999" data-i18n="unlimited">不限</option>
            </select>
          </label>
          <label>
            <span data-i18n="fishTarget">每周鱼类目标</span>
            <select id="fishTarget">
              <option value="0" data-i18n="noLimit">不限制</option>
              <option value="1" selected data-i18n="atLeast1">至少 1 次</option>
              <option value="2" data-i18n="atLeast2">至少 2 次</option>
            </select>
          </label>
          <label>
            <span data-i18n="beanTarget">每周豆类目标</span>
            <select id="beanTarget">
              <option value="0" data-i18n="noLimit">不限制</option>
              <option value="1" selected data-i18n="atLeast1">至少 1 次</option>
              <option value="2" data-i18n="atLeast2">至少 2 次</option>
            </select>
          </label>
          <label>
            <span data-i18n="excludeAllergens">排除过敏原</span>
            <input id="excludedAllergens" placeholder="如：鸡蛋, 牛奶" data-i18n-placeholder="excludePlaceholder" />
          </label>
        </div>

        <div class="toolbar planner-actions" style="margin-bottom:16px">
          <button class="btn primary" id="generateBtn" data-i18n="generate">生成一周菜单</button>
          <button class="btn soft" id="clearWeekBtn" data-i18n="clearWeek">清空菜单</button>
        </div>

        <div id="weekGrid" class="week-grid" aria-live="polite"></div>
      </div>
    </section>

    <section class="view" id="recipes">
      <div class="panel">
        <h2 data-i18n="addRecipe">添加食谱</h2>
        <div class="grid form-grid">
          <label>
            <span data-i18n="recipeName">食谱名称</span>
            <input id="recipeName" placeholder="番茄牛肉软饭" data-i18n-placeholder="recipeNamePlaceholder" />
          </label>
          <fieldset class="meal-type-fieldset">
            <legend data-i18n="mealTypes">适用餐别（可多选）</legend>
            <div class="meal-type-options" id="mealTypeOptions">
              <label class="meal-type-option"><input type="checkbox" name="mealType" value="早餐" checked /><span data-i18n="mealBreakfast">早餐</span></label>
              <label class="meal-type-option"><input type="checkbox" name="mealType" value="午餐" /><span data-i18n="mealLunch">午餐</span></label>
              <label class="meal-type-option"><input type="checkbox" name="mealType" value="晚餐" /><span data-i18n="mealDinner">晚餐</span></label>
              <label class="meal-type-option"><input type="checkbox" name="mealType" value="下午茶" /><span data-i18n="mealSnack">下午茶</span></label>
            </div>
            <p class="helper-text" data-i18n="mealTypeHelp">例如香蕉松饼可以同时用于早餐和下午茶。</p>
          </fieldset>
          <label>
            <span data-i18n="protein">主要蛋白质</span>
            <select id="protein">
              <option value="无" data-i18n="proteinNone">无</option>
              <option value="鸡蛋" data-i18n="proteinEgg">鸡蛋</option>
              <option value="牛肉" data-i18n="proteinBeef">牛肉</option>
              <option value="鸡肉" data-i18n="proteinChicken">鸡肉</option>
              <option value="猪肉" data-i18n="proteinPork">猪肉</option>
              <option value="鱼" data-i18n="proteinFish">鱼</option>
              <option value="虾" data-i18n="proteinShrimp">虾</option>
              <option value="豆类" data-i18n="proteinBeans">豆类</option>
              <option value="奶制品" data-i18n="proteinDairy">奶制品</option>
            </select>
          </label>
          <label>
            <span data-i18n="cookTime">烹饪时间（分钟）</span>
            <input id="cookTime" type="number" min="0" value="20" />
          </label>
          <label>
            <span data-i18n="ingredients">食材，用逗号分隔</span>
            <input id="ingredients" placeholder="牛肉, 番茄, 米饭, 西兰花" data-i18n-placeholder="ingredientsPlaceholder" />
          </label>
          <label>
            <span data-i18n="allergens">过敏原，用逗号分隔</span>
            <input id="allergens" placeholder="鸡蛋, 牛奶, 小麦" data-i18n-placeholder="allergensPlaceholder" />
          </label>
          <label>
            <span data-i18n="tags">标签，用逗号分隔</span>
            <input id="tags" placeholder="快手, 可冷冻, daycare" data-i18n-placeholder="tagsPlaceholder" />
          </label>
          <label>
            <span data-i18n="rating">宝宝喜欢程度</span>
            <select id="rating">
              <option value="0" selected data-i18n="ratingUnknown">未知</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
          <label class="span-2">
            <span data-i18n="notes">做法与备注</span>
            <textarea id="notes" placeholder="切小块、蒸软、适合手指食物……" data-i18n-placeholder="notesPlaceholder"></textarea>
          </label>
        </div>
        <div class="toolbar" style="margin-top:14px">
          <button class="btn primary" id="saveRecipeBtn" data-i18n="saveRecipe">保存食谱</button>
          <button class="btn" id="cancelEditBtn" type="button" data-i18n="cancelEdit" hidden>取消编辑</button>
          <button class="btn" id="seedBtn" data-i18n="seedRecipes">导入一组示例食谱</button>
        </div>
        <p class="helper-text" data-i18n="seedHelp">“示例食谱”是一组用于体验规划功能的常见宝宝餐。只会添加到你自己的浏览器里，也可以随时删除。</p>
      </div>

      <div id="recipeList" class="recipe-list"></div>
    </section>

    <section class="view" id="shopping">
      <div class="panel">
        <h2 data-i18n="shoppingTitle">本周购物清单</h2>
        <div class="toolbar" style="margin-bottom:14px">
          <button class="btn primary" id="refreshShoppingBtn" data-i18n="refreshShopping">重新汇总</button>
          <button class="btn" id="copyShoppingBtn" data-i18n="copyText">复制文本</button>
        </div>
        <div id="shoppingContent"></div>
      </div>
    </section>

    <p class="footer-note" data-i18n="footerNote">提示：清除浏览器数据可能会删除本地食谱。请偶尔使用“导出数据”备份。</p>
  </main>

    const DAY_LABELS = {
      zh: {"周一":"周一","周二":"周二","周三":"周三","周四":"周四","周五":"周五","周六":"周六","周日":"周日"},
      en: {"周一":"Monday","周二":"Tuesday","周三":"Wednesday","周四":"Thursday","周五":"Friday","周六":"Saturday","周日":"Sunday"}
    };
    const MEAL_LABELS = { zh:{"早餐":"早餐","午餐":"午餐","下午茶":"下午茶","晚餐":"晚餐"}, en:{"早餐":"Breakfast","午餐":"Lunch","下午茶":"Afternoon Snack","晚餐":"Dinner"} };
    const PROTEIN_LABELS = { zh:{"无":"无","鸡蛋":"鸡蛋","牛肉":"牛肉","鸡肉":"鸡肉","猪肉":"猪肉","鱼":"鱼","虾":"虾","豆类":"豆类","奶制品":"奶制品"}, en:{"无":"None","鸡蛋":"Egg","牛肉":"Beef","鸡肉":"Chicken","猪肉":"Pork","鱼":"Fish","虾":"Shrimp","豆类":"Beans","奶制品":"Dairy"} };
    let currentLanguage = localStorage.getItem("babyMealPlannerLanguage") || "zh";
    function t(key, ...args) { const value = I18N[currentLanguage][key]; return typeof value === "function" ? value(...args) : (value ?? key); }
    function displayMeal(value) { return MEAL_LABELS[currentLanguage][value] || value; }
    function displayProtein(value) { return PROTEIN_LABELS[currentLanguage][value] || value; }
    function applyLanguage() {
      document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : "en";
      document.title = currentLanguage === "zh" ? "宝宝每周食谱规划器" : "Baby Weekly Meal Planner";
      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
      document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
      document.querySelector("#languageBtn").textContent = currentLanguage === "zh" ? "English" : "中文";
      document.querySelector("#saveRecipeBtn").textContent = editingRecipeId ? t("updateRecipe") : t("saveRecipe");
      localStorage.setItem("babyMealPlannerLanguage", currentLanguage);
      renderAll();
    }

    const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
    const MEALS = ["早餐","午餐","下午茶","晚餐"];
    const STORAGE_KEY = "babyMealPlannerV2";
    const LEGACY_STORAGE_KEY = "babyMealPlannerV1";

    const state = {
      recipes: [],
      week: {},
      settings: {
        weekdayMax: 30,
        fishTarget: 1,
        beanTarget: 1,
        excludedAllergens: ""
      }
    };

    let editingRecipeId = null;

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function normalizeRecipe(recipe) {
      const rawMealTypes = Array.isArray(recipe.mealTypes)
        ? recipe.mealTypes
        : [recipe.mealType || "早餐"];
      const mealTypes = [...new Set(rawMealTypes.map(type => type === "加餐" ? "下午茶" : type))];
      const rating = Number.isFinite(Number(recipe.rating)) ? Number(recipe.rating) : 0;
      return { ...recipe, mealTypes, rating };
    }

    function migrateWeek(week) {
      const migrated = {};
      Object.entries(week || {}).forEach(([day, meals]) => {
        migrated[day] = { ...(meals || {}) };
        if (migrated[day]["加餐"] && !migrated[day]["下午茶"]) {
          migrated[day]["下午茶"] = migrated[day]["加餐"];
        }
        delete migrated[day]["加餐"];
      });
      return migrated;
    }

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        state.recipes = (parsed.recipes || []).map(normalizeRecipe);
        state.week = migrateWeek(parsed.week || {});
        state.settings = { ...state.settings, ...(parsed.settings || {}) };
        save();
      } catch (err) {
        console.error(err);
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function splitList(value) {
      return value.split(/[,，]/).map(v => v.trim()).filter(Boolean);
    }

    function normalize(value) {
      return value.trim().toLowerCase();
    }

    function getExcluded() {
      return splitList(document.querySelector("#excludedAllergens").value).map(normalize);
    }

    function recipeAllowed(recipe, dayIndex) {
      const excluded = getExcluded();
      const hasBlocked = recipe.allergens.some(a => excluded.includes(normalize(a)));
      if (hasBlocked) return false;
      if (dayIndex < 5 && Number(recipe.cookTime) > Number(state.settings.weekdayMax)) return false;
      return true;
    }

    function scoreRecipe(recipe, recentIds, previousProtein) {
      let score = (Number(recipe.rating) > 0 ? Number(recipe.rating) : 3) * 2;
      if (!recentIds.includes(recipe.id)) score += 4;
      if (recipe.protein && recipe.protein !== previousProtein) score += 2;
      if (recipe.tags.some(t => /快手|可冷冻|daycare/i.test(t))) score += 1;
      score += Math.random() * 3;
      return score;
    }

    function chooseRecipe(mealType, dayIndex, usedIds, previousProtein) {
      const candidates = state.recipes
        .filter(r => r.mealTypes.includes(mealType) && recipeAllowed(r, dayIndex))
        .sort((a, b) => scoreRecipe(b, usedIds, previousProtein) - scoreRecipe(a, usedIds, previousProtein));

      const fresh = candidates.filter(r => !usedIds.includes(r.id));
      const pool = fresh.length ? fresh : candidates;
      return pool.length ? pool[Math.floor(Math.random() * Math.min(pool.length, 3))] : null;
    }

    function ensureNutritionTargets() {
      const dinnerSlots = DAYS.map(day => ({ day, meal: "晚餐", ...state.week[day]?.["晚餐"] }));
      const replaceForProtein = (protein, target) => {
        let current = dinnerSlots.filter(s => state.recipes.find(r => r.id === s.recipeId)?.protein === protein).length;
        if (current >= target) return;

        const options = state.recipes.filter(r => r.mealTypes.includes("晚餐") && r.protein === protein);
        for (const option of options) {
          if (current >= target) break;
          const slot = dinnerSlots.find(s => !s.locked && state.recipes.find(r => r.id === s.recipeId)?.protein !== protein);
          if (!slot) break;
          state.week[slot.day]["晚餐"].recipeId = option.id;
          current++;
        }
      };
      replaceForProtein("鱼", Number(state.settings.fishTarget));
      replaceForProtein("豆类", Number(state.settings.beanTarget));
    }

    function generateWeek() {
      if (!state.recipes.length) {
        alert(t("addRecipesFirst"));
        return;
      }

      const usedIds = [];
      let previousProtein = "";

      DAYS.forEach((day, dayIndex) => {
        state.week[day] = state.week[day] || {};
        MEALS.forEach(meal => {
          const existing = state.week[day][meal];
          if (existing?.locked && existing.recipeId) {
            usedIds.push(existing.recipeId);
            return;
          }
          const selected = chooseRecipe(meal, dayIndex, usedIds, previousProtein);
          state.week[day][meal] = {
            recipeId: selected?.id || null,
            locked: false
          };
          if (selected) {
            usedIds.push(selected.id);
            previousProtein = selected.protein;
          }
        });
      });

      ensureNutritionTargets();
      save();
      renderWeek();
      renderShopping();
    }

    function rerollMeal(day, meal) {
      const dayIndex = DAYS.indexOf(day);
      const usedIds = Object.values(state.week).flatMap(dayObj =>
        Object.values(dayObj).map(slot => slot.recipeId).filter(Boolean)
      );
      const current = state.week[day][meal];
      const selected = chooseRecipe(meal, dayIndex, usedIds, "");
      if (selected) {
        current.recipeId = selected.id;
        current.locked = false;
        save();
        renderWeek();
        renderShopping();
      }
    }

    function toggleLock(day, meal) {
      const slot = state.week[day][meal];
      slot.locked = !slot.locked;
      save();
      renderWeek();
    }

    function renderWeek() {
      const root = document.querySelector("#weekGrid");
      root.innerHTML = "";

      DAYS.forEach(day => {
        const dayEl = document.createElement("article");
        dayEl.className = "day";
        const title = document.createElement("h3");
        title.textContent = DAY_LABELS[currentLanguage][day] || day;
        dayEl.appendChild(title);

        MEALS.forEach(meal => {
          const slot = state.week[day]?.[meal];
          const recipe = state.recipes.find(r => r.id === slot?.recipeId);

          const mealEl = document.createElement("div");
          mealEl.className = "meal";
          mealEl.innerHTML = `
            <div class="meal-label">${displayMeal(meal)}</div>
            <div class="meal-name">${recipe ? recipe.name : t("emptyMeal")}</div>
            ${recipe ? `<div class="meta">${displayProtein(recipe.protein)} · ${recipe.cookTime} ${t("minutes")}</div>` : ""}
          `;

          const actions = document.createElement("div");
          actions.className = "meal-actions";

          const reroll = document.createElement("button");
          reroll.className = "btn small";
          reroll.textContent = t("reroll");
          reroll.disabled = !recipe || slot?.locked;
          reroll.addEventListener("click", () => rerollMeal(day, meal));

          const lock = document.createElement("button");
          lock.className = "btn small";
          lock.textContent = slot?.locked ? t("locked") : t("lock");
          if (slot?.locked) lock.classList.add("locked");
          lock.disabled = !recipe;
          lock.addEventListener("click", () => toggleLock(day, meal));

          actions.append(reroll, lock);
          mealEl.appendChild(actions);
          dayEl.appendChild(mealEl);
        });

        root.appendChild(dayEl);
      });
    }

    function renderRecipes() {
      const root = document.querySelector("#recipeList");
      root.innerHTML = "";

      if (!state.recipes.length) {
        root.innerHTML = `<div class="empty" style="grid-column:1/-1">${t("noRecipes")}</div>`;
        return;
      }

      state.recipes.forEach(recipe => {
        const card = document.createElement("article");
        card.className = "recipe-card";
        const chips = [...recipe.mealTypes.map(displayMeal), displayProtein(recipe.protein), ...recipe.tags].map(x => `<span class="chip">${x}</span>`).join("");
        card.innerHTML = `
          <h3>${recipe.name}</h3>
          <div class="chips">${chips}</div>
          <div class="meta">${recipe.cookTime} ${t("minutes")} · ${t("liking")} ${recipe.rating > 0 ? `${"★".repeat(recipe.rating)}${"☆".repeat(5 - recipe.rating)}` : t("unknown")}</div>
          <div class="meta">${t("ingredientLabel")}: ${recipe.ingredients.join(currentLanguage === "zh" ? "、" : ", ") || t("notFilled")}</div>
          <div class="meta">${t("allergenLabel")}: ${recipe.allergens.join(currentLanguage === "zh" ? "、" : ", ") || t("none")}</div>
          <p>${recipe.notes || ""}</p>
        `;
        const actions = document.createElement("div");
        actions.className = "card-actions";
        const edit = document.createElement("button");
        edit.className = "btn small";
        edit.textContent = t("edit");
        edit.addEventListener("click", () => startEditingRecipe(recipe.id));
        const del = document.createElement("button");
        del.className = "btn small danger";
        del.textContent = t("delete");
        del.addEventListener("click", () => {
          if (!confirm(t("confirmDelete", recipe.name))) return;
          state.recipes = state.recipes.filter(r => r.id !== recipe.id);
          Object.values(state.week).forEach(dayObj => {
            Object.values(dayObj).forEach(slot => {
              if (slot.recipeId === recipe.id) slot.recipeId = null;
            });
          });
          save();
          renderRecipes();
          renderWeek();
          renderShopping();
        });
        actions.append(edit, del);
        card.appendChild(actions);
        root.appendChild(card);
      });
    }

    function saveRecipeFromForm() {
      const name = document.querySelector("#recipeName").value.trim();
      if (!name) {
        alert(t("addRecipeNameAlert"));
        return;
      }

      const mealTypes = [...document.querySelectorAll('input[name="mealType"]:checked')].map(input => input.value);
      if (!mealTypes.length) {
        alert(t("chooseMealAlert"));
        return;
      }

      const recipeData = {
        name,
        mealTypes,
        protein: document.querySelector("#protein").value,
        cookTime: Number(document.querySelector("#cookTime").value || 0),
        ingredients: splitList(document.querySelector("#ingredients").value),
        allergens: splitList(document.querySelector("#allergens").value),
        tags: splitList(document.querySelector("#tags").value),
        rating: Number(document.querySelector("#rating").value),
        notes: document.querySelector("#notes").value.trim()
      };

      if (editingRecipeId) {
        const index = state.recipes.findIndex(recipe => recipe.id === editingRecipeId);
        if (index !== -1) state.recipes[index] = { ...state.recipes[index], ...recipeData };
      } else {
        state.recipes.push({ id: uid(), ...recipeData });
      }

      resetRecipeForm();
      save();
      renderRecipes();
      renderWeek();
      renderShopping();
    }

    function resetRecipeForm() {
      editingRecipeId = null;
      ["recipeName","ingredients","allergens","tags","notes"].forEach(id => document.querySelector(`#${id}`).value = "");
      document.querySelector("#protein").value = "无";
      document.querySelector("#cookTime").value = 20;
      document.querySelector("#rating").value = 0;
      document.querySelectorAll('input[name="mealType"]').forEach((input, index) => input.checked = index === 0);
      document.querySelector("#saveRecipeBtn").textContent = t("saveRecipe");
      document.querySelector("#cancelEditBtn").hidden = true;
    }

    function startEditingRecipe(recipeId) {
      const recipe = state.recipes.find(item => item.id === recipeId);
      if (!recipe) return;
      editingRecipeId = recipeId;
      document.querySelector("#recipeName").value = recipe.name || "";
      document.querySelector("#protein").value = recipe.protein || "无";
      document.querySelector("#cookTime").value = recipe.cookTime ?? 0;
      document.querySelector("#ingredients").value = (recipe.ingredients || []).join(", ");
      document.querySelector("#allergens").value = (recipe.allergens || []).join(", ");
      document.querySelector("#tags").value = (recipe.tags || []).join(", ");
      document.querySelector("#rating").value = Number(recipe.rating) || 0;
      document.querySelector("#notes").value = recipe.notes || "";
      document.querySelectorAll('input[name="mealType"]').forEach(input => {
        input.checked = recipe.mealTypes.includes(input.value);
      });
      document.querySelector("#saveRecipeBtn").textContent = t("updateRecipe");
      document.querySelector("#cancelEditBtn").hidden = false;
      document.querySelector("#recipes .panel").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    const examples = [
      ["香蕉燕麦饼",["早餐","下午茶"],"鸡蛋",15,["香蕉","燕麦","鸡蛋"],["鸡蛋"],["快手","手指食物"],4,"小火煎熟，切成适合抓握的大小。"],
      ["牛油果酸奶吐司",["早餐","下午茶"],"奶制品",8,["牛油果","酸奶","吐司"],["牛奶","小麦"],["快手"],4,"吐司切条，牛油果压泥。"],
      ["番茄牛肉软饭",["午餐","晚餐"],"牛肉",25,["牛肉","番茄","米饭","西兰花"],[],["补铁","可冷冻"],5,"牛肉切碎，与番茄一起炖软。"],
      ["鸡肉南瓜意面",["午餐","晚餐"],"鸡肉",25,["鸡肉","南瓜","意面"],["小麦"],["daycare","可冷冻"],4,"南瓜压成酱，鸡肉切碎。"],
      ["豆腐蔬菜烩饭",["午餐","晚餐"],"豆类",20,["豆腐","米饭","胡萝卜","豌豆"],["大豆"],["快手"],4,"食材切小并煮软。"],
      ["三文鱼土豆饼",["午餐","晚餐"],"鱼",30,["三文鱼","土豆","豌豆"],["鱼"],["手指食物","可冷冻"],4,"煎或烤至熟透。"],
      ["鸡肉西兰花面",["午餐","晚餐"],"鸡肉",20,["鸡肉","西兰花","面条"],["小麦"],["快手"],5,"面条剪短，所有食材煮软。"],
      ["猪肉白菜小馄饨",["午餐","晚餐"],"猪肉",45,["猪肉","白菜","馄饨皮"],["小麦"],["可冷冻"],5,"一次多包一些冷冻。"],
      ["酸奶蓝莓杯",["早餐","下午茶"],"奶制品",5,["酸奶","蓝莓"],["牛奶"],["快手"],4,"蓝莓按年龄处理。"],
      ["香蕉花生酱吐司",["早餐","下午茶"],"豆类",5,["香蕉","花生酱","吐司"],["花生","小麦"],["快手"],4,"花生酱薄涂，避免过厚。"],
      ["蒸红薯条",["下午茶"],"无",20,["红薯"],[],["手指食物"],5,"蒸至容易压碎。"],

    ];

    function seedRecipes() {
      const confirmed = confirm(t("seedConfirm"));
      if (!confirmed) return;
      const existingNames = new Set(state.recipes.map(r => r.name));
      examples.forEach(([name, mealTypes, protein, cookTime, ingredients, allergens, tags, rating, notes]) => {
        if (!existingNames.has(name)) {
          state.recipes.push({ id: uid(), name, mealTypes, protein, cookTime, ingredients, allergens, tags, rating, notes });
        }
      });
      save();
      renderRecipes();
    }

    function renderShopping() {
      const root = document.querySelector("#shoppingContent");
      const counts = new Map();

      Object.values(state.week).forEach(dayObj => {
        Object.values(dayObj).forEach(slot => {
          const recipe = state.recipes.find(r => r.id === slot.recipeId);
          if (!recipe) return;
          recipe.ingredients.forEach(item => {
            counts.set(item, (counts.get(item) || 0) + 1);
          });
        });
      });

      if (!counts.size) {
        root.innerHTML = `<div class="empty">${t("shoppingEmpty")}</div>`;
        return;
      }

      const sorted = [...counts.entries()].sort((a,b) => a[0].localeCompare(b[0], "zh-CN"));
      root.innerHTML = `<ul class="shopping">${sorted.map(([name, count]) => `<li>${name}${count > 1 ? ` × ${count}` : ""}</li>`).join("")}</ul>`;
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "baby-meal-planner-backup.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          state.recipes = (parsed.recipes || []).map(normalizeRecipe);
          state.week = migrateWeek(parsed.week || {});
          state.settings = { ...state.settings, ...(parsed.settings || {}) };
          save();
          hydrateSettings();
          renderAll();
          alert(t("importSuccess"));
        } catch {
          alert(t("importFail"));
        }
      };
      reader.readAsText(file);
    }

    function hydrateSettings() {
      document.querySelector("#weekdayMax").value = state.settings.weekdayMax;
      document.querySelector("#fishTarget").value = state.settings.fishTarget;
      document.querySelector("#beanTarget").value = state.settings.beanTarget;
      document.querySelector("#excludedAllergens").value = state.settings.excludedAllergens || "";
    }

    function syncSettings() {
      state.settings.weekdayMax = Number(document.querySelector("#weekdayMax").value);
      state.settings.fishTarget = Number(document.querySelector("#fishTarget").value);
      state.settings.beanTarget = Number(document.querySelector("#beanTarget").value);
      state.settings.excludedAllergens = document.querySelector("#excludedAllergens").value;
      save();
    }

    function renderAll() {
      renderRecipes();
      renderWeek();
      renderShopping();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector(`#${tab.dataset.view}`).classList.add("active");
      });
    });

    document.querySelector("#saveRecipeBtn").addEventListener("click", saveRecipeFromForm);
    document.querySelector("#cancelEditBtn").addEventListener("click", resetRecipeForm);
    document.querySelector("#seedBtn").addEventListener("click", seedRecipes);
    document.querySelector("#generateBtn").addEventListener("click", () => { syncSettings(); generateWeek(); });
    document.querySelector("#clearWeekBtn").addEventListener("click", () => {
      if (!confirm(t("clearConfirm"))) return;
      state.week = {};
      save();
      renderWeek();
      renderShopping();
    });
    document.querySelector("#refreshShoppingBtn").addEventListener("click", renderShopping);
    document.querySelector("#copyShoppingBtn").addEventListener("click", async () => {
      const items = [...document.querySelectorAll("#shoppingContent li")].map(li => `• ${li.textContent}`).join("\n");
      if (!items) return;
      try {
        await navigator.clipboard.writeText(items);
        alert(t("copied"));
      } catch {
        alert(t("copyFail"));
      }
    });

    document.querySelector("#languageBtn").addEventListener("click", () => {
      currentLanguage = currentLanguage === "zh" ? "en" : "zh";
      applyLanguage();
    });
    document.querySelector("#printBtn").addEventListener("click", () => window.print());

    document.querySelector("#exportBtn").addEventListener("click", exportData);
    document.querySelector("#importInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (file) importData(file);
      e.target.value = "";
    });

    ["weekdayMax","fishTarget","beanTarget","excludedAllergens"].forEach(id => {
      document.querySelector(`#${id}`).addEventListener("change", syncSettings);
    });

    load();
    hydrateSettings();
    applyLanguage();
  </script>
</body>
</html>
